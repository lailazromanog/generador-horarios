<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Generador de Horarios Universitarios</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header>
    <h1>&#127979; Generador de Horarios</h1>
    <span>Planifica tu semestre universitario</span>
</header>

<main>

    <!-- ═══════════════════════════════════════════════════════════════════
         COLUMNA IZQUIERDA — Panel de administración
    ════════════════════════════════════════════════════════════════════ -->
    <aside id="panel-admin">

        <!-- Sección: Nueva Materia -->
        <div class="card">
            <h2>&#10133; Nueva Materia</h2>
            <div class="formulario">
                <label for="input-nombre-materia">Nombre de la materia</label>
                <input type="text" id="input-nombre-materia"
                       placeholder="Ej: Cálculo I, Física II…"/>
                <button class="btn btn-primario" onclick="agregarMateria()">
                    Agregar materia
                </button>
            </div>
            <div class="lista-materias-admin" id="lista-materias-admin"></div>
        </div>

        <!-- Sección: Nuevo Profesor -->
        <div class="card">
            <h2>&#128101; Nuevo Profesor</h2>
            <div class="formulario">
                <label for="select-materia-profesor">Materia</label>
                <select id="select-materia-profesor">
                    <option value="">— seleccionar materia —</option>
                </select>

                <label for="input-nombre-profesor">Nombre del profesor</label>
                <input type="text" id="input-nombre-profesor"
                       placeholder="Ej: Dr. García"/>

                <label for="input-nota-profesor">
                    Nota personal
                    <span style="font-weight:400;color:#90A4AE">
                        (número o texto, opcional)
                    </span>
                </label>
                <input type="text" id="input-nota-profesor"
                       placeholder="Ej: 8.5 o &quot;muy bueno&quot;"/>

                <button class="btn btn-primario" onclick="agregarProfesor()">
                    Agregar profesor
                </button>
            </div>
        </div>

        <!-- Sección: Nuevo Bloque Horario -->
        <div class="card">
            <h2>&#128336; Nuevo Bloque Horario</h2>
            <div class="formulario">
                <label for="select-materia-bloque">Materia</label>
                <select id="select-materia-bloque" onchange="actualizarProfesoresBloque()">
                    <option value="">— seleccionar materia —</option>
                </select>

                <label for="select-profesor-bloque">Profesor</label>
                <select id="select-profesor-bloque">
                    <option value="">— seleccionar profesor —</option>
                </select>

                <label for="select-dia">Día</label>
                <select id="select-dia">
                    <option value="LUNES">Lunes</option>
                    <option value="MARTES">Martes</option>
                    <option value="MIERCOLES">Miércoles</option>
                    <option value="JUEVES">Jueves</option>
                    <option value="VIERNES">Viernes</option>
                    <option value="SABADO">Sábado</option>
                </select>

                <label for="input-hora-inicio">Hora inicio</label>
                <input type="time" id="input-hora-inicio" value="08:00"/>

                <label for="input-hora-fin">Hora fin</label>
                <input type="time" id="input-hora-fin" value="10:00"/>

                <button class="btn btn-primario" onclick="agregarBloque()">
                    Agregar bloque
                </button>
            </div>
        </div>

    </aside>

    <!-- ═══════════════════════════════════════════════════════════════════
         COLUMNA DERECHA — Panel de selección
    ════════════════════════════════════════════════════════════════════ -->
    <section class="card" id="panel-seleccion">
        <h2>&#9989; Materias a cursar este semestre</h2>

        <div class="lista-materias-seleccion" id="lista-materias-seleccion">
            <p class="texto-sin-materias" id="texto-sin-materias">
                Aún no hay materias. Agrégalas en el panel izquierdo.
            </p>
        </div>

        <button class="btn btn-generar" onclick="generarHorario()">
            &#9654; Generar horario
        </button>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         COLUMNA DERECHA — Panel de resultados
    ════════════════════════════════════════════════════════════════════ -->
    <section class="card" id="panel-resultados">
        <h2>&#128197; Horario generado</h2>

        <!-- Resumen de puntuación -->
        <div class="resumen-puntuacion" id="resumen-puntuacion"></div>

        <!-- Advertencias de choques -->
        <div id="contenedor-choques"></div>

        <!-- Grilla de horario Lunes–Sábado -->
        <div class="contenedor-grilla">
            <table class="grilla-horario" id="tabla-horario">
                <thead>
                    <tr>
                        <th class="col-hora">Hora</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                        <th>Sábado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </div>
    </section>

</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
